
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FERRARI | فيراري</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
:root{--pink:#ed5797;--deep:#c93679;--pale:#fff0f6}
body{margin:0;font-family:Arial,sans-serif;background:white;color:#29252a}
button{border:0;cursor:pointer;font-family:inherit}
#intro{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:35px 22px;background:linear-gradient(160deg,#fff 55%,#ffe2ed)}
.brand{font-size:35px;font-weight:900;color:var(--pink);letter-spacing:3px}
.brand small{display:block;font-size:14px;letter-spacing:4px;color:#777;margin-top:6px}
.car-photo{width:100%;max-width:520px;height:290px;object-fit:cover;border-radius:22px;box-shadow:0 12px 35px #c9367930}
h1{font-size:28px;margin:14px 0;color:#333}
p{color:#888;line-height:1.8}
.buttons{width:100%;max-width:400px}
.btn{width:100%;padding:16px;background:var(--pink);color:white;border-radius:13px;font-size:17px;font-weight:bold;margin-top:12px}
.btn.light{background:white;color:var(--pink);border:1px solid var(--pink)}
#app{display:none;height:100dvh;position:relative;overflow:hidden}
#map{position:absolute;inset:0 0 190px;z-index:1;background:#eee}
.top{position:absolute;top:16px;right:15px;left:15px;z-index:500;display:flex;justify-content:space-between;align-items:center}
.circle{width:53px;height:53px;border-radius:50%;background:white;box-shadow:0 3px 15px #0002;font-size:23px}
.wallet{padding:15px 17px;border-radius:30px;background:white;box-shadow:0 3px 15px #0002;font-weight:bold}
.wallet b{color:var(--pink)}
.sheet{position:absolute;bottom:0;right:0;left:0;z-index:600;background:white;border-radius:23px 23px 0 0;padding:17px 17px 24px;box-shadow:0 -5px 25px #0001}
.sheet-title{display:flex;justify-content:space-between;align-items:center}
.sheet-title h2{font-size:23px;margin:0}
.car-small{font-size:34px}
.options{display:grid;grid-template-columns:1fr 1fr 55px;gap:9px;margin-top:15px}
.option{background:#fff5f9;border:1px solid #f4d8e5;border-radius:13px;padding:12px 4px;color:#444;font-size:13px}
.option span{display:block;font-size:22px;margin-bottom:5px}
.add{background:var(--pink);color:white;border-radius:50%;font-size:30px}
.request{width:100%;background:var(--pink);color:white;border-radius:13px;padding:15px;margin-top:13px;font-size:17px;font-weight:bold}
.note{text-align:center;font-size:12px;margin:8px 0 0}
#menu{position:absolute;z-index:800;top:0;bottom:0;right:0;width:290px;background:white;padding:25px;box-shadow:-5px 0 25px #0002;transform:translateX(110%);transition:.2s}
#menu.open{transform:translateX(0)}
#menu h2{color:var(--pink)}
.menuitem{display:block;width:100%;padding:16px;margin:9px 0;text-align:right;border-radius:12px;background:#fff1f7;color:#333}
#login{display:none;position:absolute;z-index:900;inset:0;background:white;padding:25px;overflow:auto}
#login h2{color:var(--pink)}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;margin:9px 0;font-size:16px}
.msg{color:var(--pink);font-size:14px}
@media(min-width:750px){.sheet{left:auto;width:430px;bottom:20px;right:20px;border-radius:22px}.car-photo{height:330px}#map{inset:0}}
</style>
</head>
<body>

<section id="intro">
 <div class="brand">FERRARI<small>فيراري</small></div>

 <img class="car-photo"
 src="https://commons.wikimedia.org/wiki/Special:FilePath/RED-Ferrari.jpg"
 alt="سيارة فيراري حمراء">

 <div>
  <h1>مرحباً بك في فيراري</h1>
  <p>رحلتك تبدأ بضغطة زر<br>تنقل براحة وأناقة وأمان</p>
 </div>

 <div class="buttons">
  <button class="btn" onclick="showLogin()">تسجيل الدخول</button>
  <button class="btn light" onclick="showLogin()">إنشاء حساب</button>
  <button class="btn light" onclick="openApp()">استكشاف التطبيق</button>
 </div>
</section>

<section id="app">
 <div id="map"></div>

 <div class="top">
  <button class="circle" onclick="toggleMenu()">☰</button>
  <div class="wallet">رصيدي: <b>0 د.ل</b></div>
 </div>

 <aside id="menu">
  <h2>FERRARI | فيراري</h2>
  <button class="menuitem" onclick="showLogin()">👤 حسابي</button>
  <button class="menuitem" onclick="alert('ستظهر رحلاتك هنا')">🚘 رحلاتي</button>
  <button class="menuitem" onclick="alert('المحفظة ستتوفر بعد تفعيل الدفع')">💳 محفظتي</button>
  <button class="menuitem" onclick="toggleMenu()">إغلاق ✕</button>
 </aside>

 <div class="sheet">
  <div class="sheet-title">
   <h2>إلى أين تريد الذهاب؟</h2>
   <div class="car-small">🚘</div>
  </div>
  <div class="options">
   <button class="option" onclick="savePlace('home')"><span>⌂</span>المنزل</button>
   <button class="option" onclick="savePlace('work')"><span>▣</span>مكان العمل</button>
   <button class="add" onclick="resetMap()">+</button>
  </div>
  <button class="request" onclick="requestRide()">اطلب رحلتك الآن</button>
  <p class="note" id="status">حدد موقع الانطلاق والوجهة بالضغط على الخريطة</p>
 </div>

 <div id="login">
  <button class="circle" onclick="closeLogin()">←</button>
  <h2>تسجيل الدخول</h2>
  <p>أدخل رقم هاتفك الليبي</p>
  <input id="phone" type="tel" placeholder="+2189XXXXXXXX">
  <div id="recaptcha-container"></div>
  <button class="btn" onclick="sendCode()">إرسال رمز التحقق</button>
  <div id="verifyBox" hidden>
   <input id="otp" placeholder="رمز التحقق" inputmode="numeric">
   <button class="btn" onclick="verifyCode()">تأكيد</button>
  </div>
  <p class="msg" id="message"></p>
 </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyDE_wyCpcoDStuUyNud9PiUPwezS83Xr00",
authDomain:"tawsila-53870.firebaseapp.com",
projectId:"tawsila-53870",
storageBucket:"tawsila-53870.firebasestorage.app",
messagingSenderId:"200480445099",
appId:"1:200480445099:web:2be93d9778ba54c84b1dee"
};

let auth=null,db=null,user=null,confirmation=null,verifier=null;
try{
firebase.initializeApp(firebaseConfig);
auth=firebase.auth();
db=firebase.firestore();
auth.onAuthStateChanged(u=>user=u);
}catch(e){console.log(e)}

let map=null,start=null,end=null,markers=[],route=null;

function openApp(){
document.getElementById("intro").style.display="none";
document.getElementById("app").style.display="block";
if(!map){
map=L.map("map").setView([32.8872,13.1913],13);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{
attribution:"© OpenStreetMap © CARTO",maxZoom:20
}).addTo(map);
L.control.zoom({position:"bottomright"}).addTo(map);
map.on("click",selectPoint);
}
setTimeout(()=>map.invalidateSize(),300);
}

function showLogin(){openApp();document.getElementById("login").style.display="block"}
function closeLogin(){document.getElementById("login").style.display="none"}
function toggleMenu(){document.getElementById("menu").classList.toggle("open")}

function selectPoint(e){
if(!start || end){
resetMap();
start=e.latlng;
markers.push(L.marker(start).addTo(map).bindPopup("الانطلاق").openPopup());
document.getElementById("status").innerText="تم تحديد الانطلاق، اختر الوجهة";
}else{
end=e.latlng;
markers.push(L.marker(end).addTo(map).bindPopup("الوجهة"));
map.fitBounds(L.latLngBounds(start,end),{padding:[30,30]});
document.getElementById("status").innerText="تم تحديد الوجهة، اطلب رحلتك الآن";
}
}

function resetMap(){
if(!map)return;
markers.forEach(m=>map.removeLayer(m));
markers=[];start=null;end=null;
if(route){map.removeLayer(route);route=null}
document.getElementById("status").innerText="حدد موقع الانطلاق والوجهة بالضغط على الخريطة";
}

function savePlace(type){
if(!start){alert("حدد موقع الانطلاق أولاً");return}
localStorage.setItem(type,JSON.stringify([start.lat,start.lng]));
alert("تم حفظ الموقع على هذا الجهاز");
}

async function requestRide(){
if(!user){showLogin();return}
if(!start||!end){alert("حدد الانطلاق والوجهة على الخريطة");return}
try{
const url=`https://router.project-osrm.org/route/v1/driving/${start.lng},${start.lat};${end.lng},${end.lat}?overview=full&geometries=geojson`;
const response=await fetch(url);
const data=await response.json();
if(!data.routes?.length)throw Error();
const km=data.routes[0].distance/1000;
const price=5+km*1.5;
if(route)map.removeLayer(route);
route=L.geoJSON(data.routes[0].geometry,{style:{color:"#ed5797",weight:5}}).addTo(map);
await db.collection("rides").add({
customerId:user.uid,
service:"car",
pickup:`${start.lat},${start.lng}`,
destination:`${end.lat},${end.lng}`,
distance:km,price:price,status:"pending",
createdAt:firebase.firestore.FieldValue.serverTimestamp()
});
alert("تم إرسال طلب الرحلة. السعر التقريبي: "+price.toFixed(2)+" د.ل");
}catch(e){alert("تعذر إرسال الطلب. تحقق من الاتصال وإعدادات Firebase")}
}

async function sendCode(){
const phone=document.getElementById("phone").value.trim();
const msg=document.getElementById("message");
if(!auth){msg.innerText="خدمة الدخول غير متاحة حالياً";return}
if(!/^\+2189\d{8}$/.test(phone)){msg.innerText="اكتب الرقم بصيغة +2189XXXXXXXX";return}
try{
if(!verifier){
verifier=new firebase.auth.RecaptchaVerifier("recaptcha-container",{size:"normal"});
await verifier.render();
}
confirmation=await auth.signInWithPhoneNumber(phone,verifier);
document.getElementById("verifyBox").hidden=false;
msg.innerText="تم إرسال رمز التحقق";
}catch(e){
msg.innerText="تعذر الإرسال: "+e.message;
if(verifier){verifier.clear();verifier=null}
}
}

async function verifyCode(){
try{
const result=await confirmation.confirm(document.getElementById("otp").value.trim());
user=result.user;
await db.collection("users").doc(user.uid).set({
phone:user.phoneNumber,role:"customer",
createdAt:firebase.firestore.FieldValue.serverTimestamp()
},{merge:true});
document.getElementById("message").innerText="تم تسجيل الدخول بنجاح";
setTimeout(closeLogin,1000);
}catch(e){document.getElementById("message").innerText="رمز غير صحيح أو حدث خطأ"}
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>توصيلة | Tawsila</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#08090b;color:#fff;font-family:Arial,sans-serif}
:root{--gold:#d9b45b;--panel:#17191d}
header{height:65px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;background:#08090b;border-bottom:1px solid #44371e}
.logo{font-size:25px;font-weight:bold;color:var(--gold)}
.logo small{display:block;font-size:9px;letter-spacing:3px;color:#aaa}
main{max-width:1100px;margin:auto;padding:14px}
.hero{height:220px;border-radius:18px;overflow:hidden;position:relative;background:#17100e;margin-bottom:15px}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 55%;opacity:.78}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#08090b 0%,transparent 90%)}
.heroText{position:absolute;z-index:2;top:25px;right:22px}
.heroText h1{font-size:30px;color:#fff;margin:12px 0}
.heroText p{color:#e4c77e}
.gold{color:var(--gold)}
.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
.card{background:var(--panel);border:1px solid #37312a;border-radius:16px;padding:17px;margin-bottom:14px}
h2{font-size:19px;color:var(--gold);margin:0 0 14px}
#map{height:490px;width:100%;border-radius:12px;background:#242424;z-index:1}
label{display:block;margin:12px 0 7px;color:#ccc;font-size:14px}
input{width:100%;padding:13px;border-radius:9px;border:1px solid #454545;background:#25272b;color:white;font-size:16px}
button{background:linear-gradient(135deg,#f0d58c,#b88b39);border:0;color:#17120a;padding:13px;border-radius:9px;font-size:15px;font-weight:bold;width:100%;margin-top:10px;cursor:pointer}
button.dark{background:#292b30;color:#fff;border:1px solid #555}
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.services button{background:#282a2e;color:#ddd;border:1px solid #444;padding:12px 4px}
.services button.active{background:#48391d;color:#f0d58c;border-color:var(--gold)}
.services span{display:block;font-size:24px;margin-bottom:6px}
.price{padding:15px;text-align:center;background:#282116;border:1px solid #725b2b;border-radius:10px;color:var(--gold);font-size:19px;margin-top:13px}
.msg{font-size:13px;color:var(--gold);line-height:1.7}
.note{font-size:12px;color:#999;line-height:1.7}
footer{text-align:center;color:#777;padding:22px}
@media(max-width:720px){
.layout{grid-template-columns:1fr}
.hero{height:190px}
.heroText h1{font-size:25px}
#map{height:360px}
}
</style>
</head>
<body>
<header>
<div class="logo">توصيلة<small>TAWSILA LUXURY</small></div>
<div class="gold">رحلتك تبدأ هنا</div>
</header>

<main>
<section class="hero">
<img src="https://commons.wikimedia.org/wiki/Special:FilePath/RED-Ferrari.jpg" alt="سيارة فيراري حمراء">
<div class="heroText">
<div class="gold">TAWSILA PREMIUM</div>
<h1>تنقّل بمستوى آخر</h1>
<p>راحة • سرعة • أمان</p>
</div>
</section>

<div class="layout">
<section class="card">
<h2>حدد رحلتك على الخريطة</h2>
<div id="map"></div>
<p class="note">اضغط على الخريطة مرة لتحديد الانطلاق ومرة ثانية لتحديد الوجهة.</p>
<button class="dark" onclick="resetMap()">مسح المواقع والبدء من جديد</button>
</section>

<div>
<section class="card">
<h2>احجز رحلتك</h2>
<div class="services">
<button class="active" onclick="choose('car',this)"><span>🚘</span>سيارة</button>
<button onclick="choose('moto',this)"><span>🏍️</span>دراجة</button>
<button onclick="choose('parcel',this)"><span>📦</span>طرود</button>
</div>
<label>موقع الانطلاق</label>
<input id="pickup" placeholder="اختر من الخريطة" readonly>
<label>الوجهة</label>
<input id="destination" placeholder="اختر من الخريطة" readonly>
<div class="price" id="price">السعر: -- د.ل</div>
<button onclick="calculate()">احسب السعر والمسافة</button>
<button onclick="order()">تأكيد طلب الرحلة</button>
<p id="orderMessage" class="msg"></p>
</section>

<section class="card" id="loginCard">
<h2>حسابك في توصيلة</h2>
<p class="note" id="loginStatus">سجل الدخول برقم هاتفك لإرسال الطلب.</p>
<label>رقم الهاتف بصيغة دولية</label>
<input id="phone" placeholder="+2189XXXXXXXX" type="tel">
<div id="recaptcha-container"></div>
<button onclick="login()" id="loginBtn">إرسال رمز التحقق</button>
<div id="verifyBox" hidden>
<label>رمز الرسالة</label>
<input id="otp" placeholder="رمز التحقق" inputmode="numeric">
<button onclick="verify()">تأكيد الدخول</button>
</div>
<p id="authMessage" class="msg"></p>
</section>
</div>
</div>
</main>

<footer>TAWSILA © 2026</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyDE_wyCpcoDStuUyNud9PiUPwezS83Xr00",
authDomain:"tawsila-53870.firebaseapp.com",
projectId:"tawsila-53870",
storageBucket:"tawsila-53870.firebasestorage.app",
messagingSenderId:"200480445099",
appId:"1:200480445099:web:2be93d9778ba54c84b1dee"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

let user=null,confirmation=null,verifier=null;
let service="car",start=null,end=null,distance=0,price=0;
let markers=[],routeLine=null;

auth.onAuthStateChanged(u=>{
user=u;
document.getElementById("loginStatus").innerText=
u?"تم تسجيل الدخول بنجاح":"سجل الدخول برقم هاتفك لإرسال الطلب.";
});

const map=L.map("map").setView([32.8872,13.1913],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
maxZoom:19,
attribution:"© OpenStreetMap"
}).addTo(map);

setTimeout(()=>map.invalidateSize(),500);

map.on("click",e=>{
if(!start || end){
resetMap();
start=e.latlng;
document.getElementById("pickup").value=
start.lat.toFixed(5)+","+start.lng.toFixed(5);
markers.push(L.marker(start).addTo(map).bindPopup("موقع الانطلاق").openPopup());
}else{
end=e.latlng;
document.getElementById("destination").value=
end.lat.toFixed(5)+","+end.lng.toFixed(5);
markers.push(L.marker(end).addTo(map).bindPopup("الوجهة"));
map.fitBounds(L.latLngBounds(start,end),{padding:[35,35]});
}
price=0;
document.getElementById("price").innerText="السعر: -- د.ل";
});

function resetMap(){
markers.forEach(m=>map.removeLayer(m));
markers=[];
if(routeLine)map.removeLayer(routeLine);
routeLine=null;start=null;end=null;price=0;distance=0;
document.getElementById("pickup").value="";
document.getElementById("destination").value="";
document.getElementById("price").innerText="السعر: -- د.ل";
}

function choose(type,btn){
service=type;
document.querySelectorAll(".services button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
price=0;
document.getElementById("price").innerText="السعر: -- د.ل";
}

async function calculate(){
if(!start||!end){alert("حدد الانطلاق والوجهة من الخريطة");return}
try{
const url=`https://router.project-osrm.org/route/v1/driving/${start.lng},${start.lat};${end.lng},${end.lat}?overview=full&geometries=geojson`;
const res=await fetch(url);
const data=await res.json();
if(!data.routes?.length)throw Error("لم يتم العثور على مسار");
distance=data.routes[0].distance/1000;
const base=service==="car"?5:service==="moto"?3:4;
const rate=service==="car"?1.5:service==="moto"?1:1.2;
price=base+distance*rate;
if(routeLine)map.removeLayer(routeLine);
routeLine=L.geoJSON(data.routes[0].geometry,{style:{color:"#d9b45b",weight:5}}).addTo(map);
document.getElementById("price").innerText=
distance.toFixed(1)+" كم | "+price.toFixed(2)+" د.ل تقريباً";
}catch(e){alert("تعذر حساب المسار. حاول مرة أخرى")}
}

async function login(){
const phone=document.getElementById("phone").value.trim();
const msg=document.getElementById("authMessage");
if(!/^\+2189\d{8}$/.test(phone)){
msg.innerText="اكتب رقمك بصيغة +2189XXXXXXXX";return;
}
try{
document.getElementById("loginBtn").disabled=true;
if(!verifier){
verifier=new firebase.auth.RecaptchaVerifier("recaptcha-container",{size:"normal"});
await verifier.render();
}
confirmation=await auth.signInWithPhoneNumber(phone,verifier);
document.getElementById("verifyBox").hidden=false;
msg.innerText="أرسلنا رمز التحقق إلى هاتفك";
}catch(e){
msg.innerText="تعذر الإرسال: "+e.message;
if(verifier){verifier.clear();verifier=null}
}finally{
document.getElementById("loginBtn").disabled=false;
}
}

async function verify(){
try{
const code=document.getElementById("otp").value.trim();
const result=await confirmation.confirm(code);
user=result.user;
await db.collection("users").doc(user.uid).set({
phone:user.phoneNumber,role:"customer",
createdAt:firebase.firestore.FieldValue.serverTimestamp()
},{merge:true});
document.getElementById("authMessage").innerText="تم تسجيل الدخول بنجاح";
}catch(e){
document.getElementById("authMessage").innerText="رمز غير صحيح أو حدث خطأ: "+e.message;
}
}

async function order(){
if(!user){alert("سجل الدخول أولاً");return}
if(!start||!end||!price){alert("حدد الموقعين واحسب السعر أولاً");return}
try{
await db.collection("rides").add({
customerId:user.uid,
service:service,
pickup:document.getElementById("pickup").value,
destination:document.getElementById("destination").value,
distance:distance,
price:price,
status:"pending",
createdAt:firebase.firestore.FieldValue.serverTimestamp()
});
document.getElementById("orderMessage").innerText="تم إرسال طلبك بنجاح";
}catch(e){
document.getElementById("orderMessage").innerText="تعذر إرسال الطلب: "+e.message;
}
}
</script>
</body>
</html>

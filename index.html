
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FERRARI | فيراري</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
:root{--pink:#ed1675;--deep:#c91662;--pale:#fff0f6}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;color:#29252a;background:#fff}
button{border:0;cursor:pointer;font-family:inherit}
#intro{position:fixed;inset:0;z-index:1000;background:#ffe5ef;overflow:hidden}
#intro-art{width:100%;height:100%;object-fit:fill;display:block}
.intro-hit{position:absolute;right:10%;width:80%;height:7.2%;background:transparent;border-radius:50px;z-index:2}
#login-hit{top:68.2%}#signup-hit{top:76.4%}#explore-hit{top:84.5%}
#app{display:none;height:100dvh;position:relative;overflow:hidden;background:#f8f8f8}
#map{position:absolute;inset:0 0 190px;z-index:1;background:#eee}
.locate-btn{position:absolute;z-index:550;left:16px;top:88px;width:49px;height:49px;border-radius:50%;background:#fff;color:var(--pink);font-size:22px;box-shadow:0 3px 15px #0002}
.car-pin{font-size:25px;filter:drop-shadow(0 2px 3px #0005);transform:translate(-50%,-50%);white-space:nowrap}
.map-hint{position:absolute;z-index:550;top:148px;left:12px;background:#fff;padding:8px 11px;border-radius:12px;font-size:11px;color:#777;box-shadow:0 2px 10px #0002}
.top{position:absolute;top:16px;right:15px;left:15px;z-index:500;display:flex;justify-content:space-between;align-items:center}
.circle{width:53px;height:53px;border-radius:50%;background:white;box-shadow:0 3px 15px #0002;font-size:23px;color:var(--pink)}
.wallet{padding:15px 17px;border-radius:30px;background:white;box-shadow:0 3px 15px #0002;font-weight:bold}
.wallet b{color:var(--pink)}
.sheet{position:absolute;bottom:0;right:0;left:0;z-index:600;background:white;border-radius:25px 25px 0 0;padding:18px 17px 24px;box-shadow:0 -5px 25px #0001}
.sheet-title{display:flex;justify-content:space-between;align-items:center}
.sheet-title h2{font-size:22px;margin:0}.car-small{font-size:34px}
.options{display:grid;grid-template-columns:1fr 1fr 55px;gap:9px;margin-top:15px}
.option{background:#fff5f9;border:1px solid #f4d8e5;border-radius:13px;padding:12px 4px;color:#444;font-size:13px}
.option span{display:block;font-size:22px;margin-bottom:5px}
.add{background:var(--pink);color:white;border-radius:50%;font-size:30px}
.request{width:100%;background:linear-gradient(90deg,#f52b88,#d91669);color:white;border-radius:14px;padding:16px;margin-top:13px;font-size:17px;font-weight:bold;box-shadow:0 5px 14px #ed579744}
.note{text-align:center;font-size:12px;margin:8px 0 0;color:#888}
#menu{position:absolute;z-index:800;top:0;bottom:0;right:0;width:290px;max-width:85vw;background:white;padding:25px;box-shadow:-5px 0 25px #0002;transform:translateX(110%);transition:.2s}
#menu.open{transform:translateX(0)}
#menu h2{color:var(--pink)}
.menuitem{display:block;width:100%;padding:16px;margin:9px 0;text-align:right;border-radius:12px;background:#fff1f7;color:#333}
#login{display:none;position:absolute;z-index:900;inset:0;background:white;padding:22px;overflow:auto}
#login h2{color:var(--pink)}
input,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;margin:8px 0;font-size:16px;background:white}
.btn{width:100%;padding:16px;background:var(--pink);color:white;border-radius:13px;font-size:17px;font-weight:bold;margin-top:12px}
.btn.secondary{background:#555}
.msg{color:var(--pink);font-size:14px;overflow-wrap:anywhere;line-height:1.7}
.panel{display:none;position:absolute;z-index:850;inset:0;background:#fff;padding:22px;overflow:auto}
.panel h2{color:var(--pink)}
.ride-card{border:1px solid #f2c9dc;border-radius:15px;padding:15px;margin:12px 0;background:#fff8fb}
.ride-card p{margin:7px 0;font-size:14px}
.small{font-size:12px;color:#777;line-height:1.6}
.hidden{display:none!important}
@media(min-width:750px){
#intro{background:#fff0f6}#intro-art{object-fit:contain}
.sheet{left:auto;width:430px;bottom:20px;right:20px;border-radius:22px}
#map{inset:0}.locate-btn{top:90px}
}
</style>
</head>
<body>

<section id="intro">
<img id="intro-art" src="ferrari-cover.png" alt="FERRARI">
<button id="login-hit" class="intro-hit" onclick="showLogin()"></button>
<button id="signup-hit" class="intro-hit" onclick="showLogin()"></button>
<button id="explore-hit" class="intro-hit" onclick="openApp()"></button>
</section>

<section id="app">
<div id="map"></div>
<button class="locate-btn" onclick="locateMe()">◎</button>
<div class="map-hint">🚘 سيارات قريبة على الخريطة</div>

<div class="top">
<button class="circle" onclick="toggleMenu()">☰</button>
<div class="wallet">رصيدي: <b>0 د.ل</b></div>
</div>

<aside id="menu">
<h2>FERRARI | فيراري</h2>
<button class="menuitem" onclick="showLogin()">👤 حسابي</button>
<button class="menuitem" onclick="showMyRides()">🚘 رحلاتي</button>
<button class="menuitem" onclick="showDriverPanel()">🚖 لوحة السائق</button>
<button class="menuitem" onclick="alert('المحفظة ستتوفر بعد تفعيل الدفع')">💳 محفظتي</button>
<button class="menuitem" onclick="toggleMenu()">إغلاق ✕</button>
</aside>

<div class="sheet" id="customerSheet">
<div class="sheet-title"><h2>إلى أين تريد الذهاب؟</h2><div class="car-small">🚘</div></div>
<div class="options">
<button class="option" onclick="savePlace('home')"><span>⌂</span>المنزل</button>
<button class="option" onclick="savePlace('work')"><span>▣</span>مكان العمل</button>
<button class="add" onclick="resetMap()">+</button>
</div>
<button class="request" onclick="requestRide()">اطلب رحلتك الآن</button>
<p class="note" id="status">حدد موقع الانطلاق والوجهة بالضغط على الخريطة</p>
</div>

<div id="login">
<button class="circle" onclick="closeLogin()">←</button>
<h2>حساب فيراري</h2>
<label>نوع الحساب</label>
<select id="accountType" onchange="changeAccountType()">
<option value="customer">عميل - أريد طلب رحلة</option>
<option value="driver">سائق - أريد العمل مع فيراري</option>
</select>

<div id="driverFields" class="hidden">
<input id="driverName" placeholder="اسم السائق الكامل">
<input id="driverEmail" type="email" placeholder="البريد الإلكتروني (اختياري)">
<label>نوع السيارة</label>
<select id="vehicleType">
<option value="">اختر نوع السيارة</option>
<option value="سيدان">سيدان</option>
<option value="SUV">SUV</option>
<option value="اقتصادية">اقتصادية</option>
<option value="فاخرة">فاخرة</option>
</select>
</div>

<input id="phone" type="tel" placeholder="+16505553434">
<div id="recaptcha-container"></div>
<button class="btn" onclick="sendCode()">إرسال رمز التحقق</button>

<div id="verifyBox" hidden>
<input id="otp" placeholder="رمز التحقق" inputmode="numeric">
<button class="btn" onclick="verifyCode()">تأكيد الرمز</button>
</div>
<p class="small">وضع الاختبار: استخدم رقم الاختبار المسجل في Firebase ورمز 123456.</p>
<p class="msg" id="message"></p>
</div>

<div id="driverPanel" class="panel">
<button class="circle" onclick="closeDriverPanel()">←</button>
<h2>🚖 لوحة سائق فيراري</h2>
<p id="driverStatus" class="msg">جارٍ التحقق من حساب السائق...</p>
<div id="pendingMessage" class="small"></div>
<div id="driverRides"></div>
<button class="btn secondary" onclick="loadDriverRides()">تحديث الرحلات</button>
</div>

<div id="myRides" class="panel">
<button class="circle" onclick="closeMyRides()">←</button>
<h2>🚘 رحلاتي</h2>
<div id="myRidesList"></div>
</div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyDE_wyCpcoDStuUyNud9PiUPwezS83Xr00",
authDomain:"tawsila-53870.firebaseapp.com",
projectId:"tawsila-53870",
storageBucket:"tawsila-53870.firebasestorage.app",
messagingSenderId:"200480445099",
appId:"1:200480445099:web:2be93d9778ba54c84b1dee"
};

let auth=null,db=null,user=null,confirmation=null,verifier=null;
try{
firebase.initializeApp(firebaseConfig);
auth=firebase.auth();
db=firebase.firestore();
auth.onAuthStateChanged(u=>user=u);
}catch(e){console.log(e)}

let map=null,start=null,end=null,markers=[],route=null,userMarker=null;
let nearbyCars=[],carTimer=null;
let selectedRole='customer';

function openApp(){
document.getElementById('intro').style.display='none';
document.getElementById('app').style.display='block';
if(!map){
map=L.map('map').setView([32.8872,13.1913],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap contributors',maxZoom:19
}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);
map.on('click',selectPoint);
addNearbyCars();
}
setTimeout(()=>map.invalidateSize(),300);
}

function locateMe(){
if(!navigator.geolocation){alert('تحديد الموقع غير مدعوم');return}
document.getElementById('status').innerText='جارٍ تحديد موقعك...';
navigator.geolocation.getCurrentPosition(pos=>{
const ll=L.latLng(pos.coords.latitude,pos.coords.longitude);
if(userMarker)map.removeLayer(userMarker);
userMarker=L.circleMarker(ll,{radius:9,color:'#fff',weight:3,fillColor:'#ed1675',fillOpacity:1}).addTo(map).bindPopup('موقعك الحالي');
map.setView(ll,16);
start=ll;
document.getElementById('status').innerText='تم تحديد الانطلاق. اختر الوجهة من الخريطة';
},()=>{
document.getElementById('status').innerText='تعذر تحديد الموقع. اسمح للمتصفح بالوصول إلى موقعك';
},{enableHighAccuracy:true,timeout:12000});
}

function addNearbyCars(){
const center=map.getCenter();
const offsets=[[.009,.012],[-.012,.006],[.006,-.014],[-.008,-.012]];
const icons=['🚘','🚗','🏎️','🚙'];
nearbyCars=offsets.map((o,i)=>{
const marker=L.marker([center.lat+o[0],center.lng+o[1]],{
icon:L.divIcon({className:'',html:`<div class="car-pin">${icons[i]}</div>`,iconSize:[30,30],iconAnchor:[15,15]})
}).addTo(map);
return {marker,i,base:[center.lat+o[0],center.lng+o[1]]};
});
if(carTimer)clearInterval(carTimer);
let step=0;
carTimer=setInterval(()=>{
if(!map||document.getElementById('app').style.display==='none')return;
step++;
nearbyCars.forEach(c=>{
const a=step*.00045*(c.i%2?1:-1);
c.marker.setLatLng([
c.base[0]+Math.sin(step/7+c.i)*.0015+a,
c.base[1]+Math.cos(step/8+c.i)*.0018
]);
});
},900);
}

function showLogin(){
openApp();
document.getElementById('login').style.display='block';
}
function closeLogin(){document.getElementById('login').style.display='none'}
function toggleMenu(){document.getElementById('menu').classList.toggle('open')}

function changeAccountType(){
selectedRole=document.getElementById('accountType').value;
document.getElementById('driverFields').classList.toggle('hidden',selectedRole!=='driver');
}

function selectPoint(e){
if(!start||end){
resetMap();
start=e.latlng;
markers.push(L.marker(start).addTo(map).bindPopup('الانطلاق').openPopup());
document.getElementById('status').innerText='تم تحديد الانطلاق، اختر الوجهة';
}else{
end=e.latlng;
markers.push(L.marker(end).addTo(map).bindPopup('الوجهة'));
map.fitBounds(L.latLngBounds(start,end),{padding:[30,30]});
document.getElementById('status').innerText='تم تحديد الوجهة، اطلب رحلتك الآن';
}
}

function resetMap(){
if(!map)return;
markers.forEach(m=>map.removeLayer(m));
markers=[];
start=null;end=null;
if(route){map.removeLayer(route);route=null}
if(userMarker){map.removeLayer(userMarker);userMarker=null}
document.getElementById('status').innerText='حدد موقع الانطلاق والوجهة بالضغط على الخريطة';
}

function savePlace(type){
if(!start){alert('حدد موقع الانطلاق أولاً');return}
localStorage.setItem(type,JSON.stringify([start.lat,start.lng]));
alert('تم حفظ الموقع على هذا الجهاز');
}

async function requestRide(){
if(!user){showLogin();return}
if(!start||!end){alert('حدد الانطلاق والوجهة على الخريطة');return}
if(!db){alert('قاعدة البيانات غير متاحة');return}
try{
const url=`https://router.project-osrm.org/route/v1/driving/${start.lng},${start.lat};${end.lng},${end.lat}?overview=full&geometries=geojson`;
const response=await fetch(url);
const data=await response.json();
if(!data.routes?.length)throw Error('لم يتم العثور على مسار');
const km=data.routes[0].distance/1000;
const price=5+km*1.5;
if(route)map.removeLayer(route);
route=L.geoJSON(data.routes[0].geometry,{style:{color:'#ed1675',weight:5}}).addTo(map);
await db.collection('rides').add({
customerId:user.uid,
service:'car',
pickup:`${start.lat},${start.lng}`,
destination:`${end.lat},${end.lng}`,
distance:km,
price:price,
status:'pending',
createdAt:firebase.firestore.FieldValue.serverTimestamp()
});
alert('تم إرسال طلب الرحلة. السعر التقريبي: '+price.toFixed(2)+' د.ل');
}catch(e){alert('تعذر إرسال الطلب: '+(e.message||e))}
}

async function sendCode(){
const phone=document.getElementById('phone').value.trim().replace(/\s+/g,'');
const msg=document.getElementById('message');
const verifyBox=document.getElementById('verifyBox');
msg.innerText='';
verifyBox.hidden=true;
confirmation=null;

if(!auth){msg.innerText='خدمة الدخول غير متاحة. تحقق من Firebase.';return}

if(selectedRole==='driver'){
const name=document.getElementById('driverName').value.trim();
const vehicle=document.getElementById('vehicleType').value;
if(!name||!vehicle){
msg.innerText='أدخل اسم السائق واختر نوع السيارة أولاً.';
return;
}
}

const testPhone='+16505553434';
if(phone!==testPhone){
msg.innerText='للاختبار استخدم الرقم المسجل في Firebase: +16505553434';
return;
}

try{
auth.settings.appVerificationDisabledForTesting=true;
if(verifier){try{verifier.clear()}catch(ignore){}verifier=null}
verifier=new firebase.auth.RecaptchaVerifier('recaptcha-container',{size:'normal'});
await verifier.render();
confirmation=await auth.signInWithPhoneNumber(phone,verifier);
verifyBox.hidden=false;
msg.innerText='أدخل رمز الاختبار المسجل في Firebase: 123456';
}catch(e){
confirmation=null;
msg.innerText='تعذر بدء التحقق: '+(e.code||'')+' '+(e.message||String(e));
if(verifier){try{verifier.clear()}catch(ignore){}verifier=null}
}
}

async function verifyCode(){
const msg=document.getElementById('message');
const code=document.getElementById('otp').value.trim();
if(!confirmation){msg.innerText='اضغط إرسال رمز التحقق أولاً.';return}
if(!code){msg.innerText='أدخل رمز التحقق.';return}

try{
const result=await confirmation.confirm(code);
user=result.user;
msg.innerText='تم التحقق من رقم الهاتف.';

if(selectedRole==='customer'){
await db.collection('users').doc(user.uid).set({
phone:user.phoneNumber,
role:'customer',
createdAt:firebase.firestore.FieldValue.serverTimestamp()
},{merge:true});
msg.innerText='مرحباً بك في فيراري. تم تسجيل دخولك كعميل.';
setTimeout(closeLogin,1500);
}else{
await submitDriverApplication();
}
}catch(e){
msg.innerText='تعذر إكمال العملية: '+(e.code||'')+' '+(e.message||String(e));
}
}

async function submitDriverApplication(){
const msg=document.getElementById('message');
const ref=db.collection('driverApplications').doc(user.uid);
try{
const existing=await ref.get();
if(!existing.exists){
await ref.set({
name:document.getElementById('driverName').value.trim(),
email:document.getElementById('driverEmail').value.trim(),
vehicleType:document.getElementById('vehicleType').value,
status:'pending',
createdAt:firebase.firestore.FieldValue.serverTimestamp()
});
}
msg.innerText='تم إرسال طلب انضمامك بنجاح. حسابك الآن قيد المراجعة.';
document.getElementById('pendingMessage').innerText='طلبك قيد المراجعة من الإدارة. بعد الموافقة ستتمكن من استقبال الرحلات.';
document.getElementById('login').style.display='none';
showDriverPanel();
}catch(e){
msg.innerText='تعذر إرسال طلب السائق: '+(e.code||'')+' '+(e.message||String(e));
}
}

async function showDriverPanel(){
openApp();
document.getElementById('menu').classList.remove('open');
document.getElementById('driverPanel').style.display='block';
document.getElementById('driverStatus').innerText='جارٍ التحقق من اعتماد حسابك...';
document.getElementById('driverRides').innerHTML='';
if(!user){
document.getElementById('driverStatus').innerText='سجل الدخول أولاً.';
return;
}
try{
const userDoc=await db.collection('users').doc(user.uid).get();
const data=userDoc.exists?userDoc.data():{};
if(data.role!=='driver'||data.approved!==true){
document.getElementById('driverStatus').innerText='حساب السائق غير معتمد حتى الآن.';
document.getElementById('pendingMessage').innerText='طلبك محفوظ. تنتظر موافقة الإدارة. لا يمكنك استقبال الرحلات قبل الاعتماد.';
return;
}
document.getElementById('driverStatus').innerText='تم اعتماد حسابك. يمكنك استقبال الرحلات الآن.';
document.getElementById('pendingMessage').innerText='';
await loadDriverRides();
}catch(e){
document.getElementById('driverStatus').innerText='تعذر التحقق من الحساب: '+(e.code||'')+' '+e.message;
}
}

async function loadDriverRides(){
const box=document.getElementById('driverRides');
if(!user)return;
box.innerHTML='<p>جارٍ تحميل الرحلات...</p>';
try{
const userDoc=await db.collection('users').doc(user.uid).get();
const data=userDoc.exists?userDoc.data():{};
if(data.role!=='driver'||data.approved!==true){
box.innerHTML='';
return;
}
const snap=await db.collection('rides').where('status','==','pending').get();
if(snap.empty){
box.innerHTML='<p class="small">لا توجد رحلات متاحة حالياً.</p>';
return;
}
box.innerHTML='';
snap.forEach(doc=>{
const ride=doc.data();
const card=document.createElement('div');
card.className='ride-card';
const pickup=document.createElement('p');
pickup.textContent='نقطة الانطلاق: '+(ride.pickup||'غير محدد');
const destination=document.createElement('p');
destination.textContent='الوجهة: '+(ride.destination||'غير محدد');
const price=document.createElement('p');
price.textContent='السعر التقريبي: '+Number(ride.price||0).toFixed(2)+' د.ل';
const distance=document.createElement('p');
distance.textContent='المسافة: '+Number(ride.distance||0).toFixed(2)+' كم';
const btn=document.createElement('button');
btn.className='btn';
btn.textContent='قبول الرحلة';
btn.onclick=()=>acceptRide(doc.id,btn);
card.append(pickup,destination,price,distance,btn);
box.appendChild(card);
});
}catch(e){
box.innerHTML='<p class="msg">تعذر تحميل الرحلات: '+(e.code||'')+' '+e.message+'</p>';
}
}

async function acceptRide(rideId,button){
if(!user){alert('سجل الدخول أولاً');return}
button.disabled=true;
button.textContent='جارٍ قبول الرحلة...';
try{
await db.collection('rides').doc(rideId).update({
status:'accepted',
driverId:user.uid
});
alert('تم قبول الرحلة بنجاح.');
await loadDriverRides();
}catch(e){
button.disabled=false;
button.textContent='قبول الرحلة';
alert('تعذر قبول الرحلة: '+(e.code||'')+' '+e.message);
}
}

function closeDriverPanel(){
document.getElementById('driverPanel').style.display='none';
}

async function showMyRides(){
toggleMenu();
if(!user){showLogin();return}
document.getElementById('myRides').style.display='block';
const box=document.getElementById('myRidesList');
box.innerHTML='جارٍ تحميل رحلاتك...';
try{
const snap=await db.collection('rides').where('customerId','==',user.uid).get();
if(snap.empty){box.innerHTML='<p>لا توجد رحلات حتى الآن.</p>';return}
box.innerHTML='';
snap.forEach(doc=>{
const r=doc.data();
const card=document.createElement('div');
card.className='ride-card';
card.textContent='الحالة: '+(r.status==='pending'?'بانتظار سائق':r.status==='accepted'?'تم قبول الرحلة':'مكتملة')+' — السعر: '+Number(r.price||0).toFixed(2)+' د.ل';
box.appendChild(card);
});
}catch(e){box.innerHTML='تعذر تحميل الرحلات: '+e.message}
}
function closeMyRides(){document.getElementById('myRides').style.display='none'}
</script>
</body>
</html>
